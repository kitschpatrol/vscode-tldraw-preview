name: Create VS Code Plugin GitHub Release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions: {}

jobs:
  build:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
      IS_VALID_COMMIT: false
      TAG_NAME: ''
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Log Token Type
        run: |
          if [ "$ACCESS_TOKEN" = "$GITHUB_TOKEN" ]; then
            echo "🗝️ Authenticated with GitHub Token"
          else
            echo "🔑 Authenticated with Personal Access token"
          fi

      - name: Validate Tag and Branch
        id: validation
        run: |
          TAG=$(git tag --contains HEAD | grep '^v[0-9]' | head -n 1)
          echo "🏷️ Tag for commit is: $TAG"
          BRANCH=$(git branch -r --contains "tags/${GITHUB_REF_NAME}" | grep 'origin/main' | xargs)
          if [[ -z "$BRANCH" ]]; then
            echo "🚨 Tag is not on main branch"
          else
            echo "🕊️ Current branch is: $BRANCH"
          fi
          if [[ -z "$TAG" || -z "$BRANCH" ]]; then
            echo "IS_VALID_COMMIT=false" >> "$GITHUB_ENV"
            echo "TAG_NAME=" >> "$GITHUB_ENV"
          else
            echo "IS_VALID_COMMIT=true" >> "$GITHUB_ENV"
            echo "TAG_NAME=$TAG" >> "$GITHUB_ENV"
          fi

      - name: Setup Pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - run: pnpm ci

      - name: Build Plugin
        run: pnpm run build

      - name: Pack Plugin
        run: pnpm run pack

      - name: Release Notes
        if: env.IS_VALID_COMMIT == 'true'
        id: release-notes
        uses: kitschpatrol/github-action-release-changelog@12279a22cf9d0b432dca8ff189d82ad0dd393345 # v2.0.9

      - name: Release
        if: env.IS_VALID_COMMIT == 'true'
        id: release
        uses: kitschpatrol/github-action-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          token: ${{ env.ACCESS_TOKEN }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          name: ${{ env.TAG_NAME }}
          tag_name: ${{ env.TAG_NAME }}
          body: |
            ${{ steps.release-notes.outputs.changelog }}
          files: |
            *.vsix

      - name: Log Release Details
        if: env.IS_VALID_COMMIT == 'true'
        run: |
          echo "📦 Successfully released: ${{ env.TAG_NAME }}"
          echo "🔗 Release URL: ${STEPS_RELEASE_OUTPUTS_URL}"
          echo "🪪 Release ID: ${STEPS_RELEASE_OUTPUTS_ID}"
        env:
          STEPS_RELEASE_OUTPUTS_URL: ${{ steps.release.outputs.url }}
          STEPS_RELEASE_OUTPUTS_ID: ${{ steps.release.outputs.id }}
